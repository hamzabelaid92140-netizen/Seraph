<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seraph</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="scene-menu" class="scene active">
  <div class="menu-bg"></div>
  <button class="sigil-btn" id="enter-fight" aria-label="enter">
    <svg viewBox="0 0 200 200" class="sigil">
      <g class="wingset">
        <path class="wing wing-l1" d="M100 110 C 60 90, 20 100, 4 60 C 30 68, 55 55, 70 30 C 75 60, 88 85, 100 110 Z"/>
        <path class="wing wing-l2" d="M100 115 C 55 100, 15 118, -6 85 C 20 88, 48 72, 62 45 C 68 72, 82 98, 100 115 Z"/>
        <path class="wing wing-r1" d="M100 110 C 140 90, 180 100, 196 60 C 170 68, 145 55, 130 30 C 125 60, 112 85, 100 110 Z"/>
        <path class="wing wing-r2" d="M100 115 C 145 100, 185 118, 206 85 C 180 88, 152 72, 138 45 C 132 72, 118 98, 100 115 Z"/>
      </g>
      <circle class="core" cx="100" cy="112" r="14"/>
    </svg>
  </button>
</div>

<div id="scene-boss" class="scene">
  <div id="stage"></div>
  <div class="hud">
    <div class="boss-bar-wrap">
      <div class="boss-bar-frame">
        <div class="health-bar boss-health">
          <div class="fill trail" id="boss-fill-trail"></div>
          <div class="fill" id="boss-fill"></div>
          <div class="segments"></div>
        </div>
      </div>
      <div class="phase-pips" id="phase-pips"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="health-bar player-health"><div class="fill" id="player-fill"></div></div>
  </div>
  <button class="exit-btn" id="exit-fight" aria-label="exit">
    <svg viewBox="0 0 24 24"><path d="M4 4 L20 20 M20 4 L4 20"/></svg>
  </button>
  <div class="result-sigil" id="result-sigil"></div>
</div>

<audio id="a-boss" src="audio/boss.mp3" preload="auto" loop></audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="script.js"></script>
</body>
</html>
